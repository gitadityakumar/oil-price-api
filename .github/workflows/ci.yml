name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: oilapi_ci
          POSTGRES_USER: oilapi
          POSTGRES_PASSWORD: oilapi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U oilapi -d oilapi_ci"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 20
    env:
      NODE_ENV: test
      DATABASE_URL: postgres://oilapi:oilapi@127.0.0.1:5432/oilapi_ci
      REDIS_URL: redis://127.0.0.1:6379
      API_KEY_PEPPER: ci-test-pepper
      ARTIFACT_LOCAL_DIR: /tmp/oil-api-artifacts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm run openapi:lint
      - run: npm run db:migrate
      - run: npm run db:migrate
      - run: npm run db:seed
      - run: npm run db:seed
      - run: npm run db:fixtures
      - run: npm run test:ci
      - run: npm audit --audit-level=high
